<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} ?: 'DentalCare'">DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        :root {
            --dental-primary: #0077b6;
            --dental-secondary: #00b4d8;
            --dental-accent: #90e0ef;
            --dental-light: #f0f9ff;
        }
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, var(--dental-primary) 0%, #023e8a 100%);
            width: 240px;
            position: fixed;
            left: 0; top: 0;
            z-index: 100;
            padding-top: 1rem;
        }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: .6rem 1.2rem; border-radius: 8px; margin: 2px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: #fff; }
        .sidebar .nav-link i { width: 20px; margin-right: 8px; }
        .sidebar-brand { color: #fff; font-size: 1.2rem; font-weight: 700; padding: 1rem 1.2rem 1.5rem; display: block; text-decoration: none; }
        .sidebar-brand span { color: var(--dental-accent); }
        .main-content { margin-left: 240px; padding: 2rem; }
        .topbar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: .75rem 2rem; margin-left: 240px; position: sticky; top: 0; z-index: 99; display: flex; justify-content: space-between; align-items: center; }
        .stat-card { border: none; border-radius: 12px; padding: 1.5rem; color: #fff; }
        .stat-card .stat-number { font-size: 2rem; font-weight: 700; }
        .badge-pendiente  { background-color: #f59e0b; }
        .badge-aceptada   { background-color: #10b981; }
        .badge-rechazada  { background-color: #ef4444; }
        .badge-cancelada  { background-color: #6b7280; }
        .badge-reprogramada { background-color: #3b82f6; }
        .badge-completada { background-color: #8b5cf6; }
        .badge-solicitada { background-color: #f97316; }
        .table-hover tbody tr:hover { background-color: var(--dental-light); }
        .btn-dental { background-color: var(--dental-primary); color: #fff; border: none; }
        .btn-dental:hover { background-color: #023e8a; color: #fff; }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar d-flex flex-column" th:fragment="sidebar">
    <a class="sidebar-brand" href="/"><i class="bi bi-tooth"></i> Dental<span>Care</span></a>
    <ul class="nav flex-column flex-grow-1">

        <!-- ADMIN -->
        <li sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/admin/dashboard}" class="nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
            <a th:href="@{/admin/usuarios/pendientes}" class="nav-link"><i class="bi bi-person-check"></i>Pendientes</a>
            <a th:href="@{/admin/usuarios}" class="nav-link"><i class="bi bi-people"></i>Usuarios</a>
        </li>

        <!-- RECEPCIONISTA -->
        <li sec:authorize="hasRole('RECEPCIONISTA')">
            <a th:href="@{/recepcionista/dashboard}" class="nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
            <a th:href="@{/recepcionista/citas/solicitadas}" class="nav-link"><i class="bi bi-calendar-check"></i>Solicitudes</a>
            <a th:href="@{/recepcionista/citas}" class="nav-link"><i class="bi bi-calendar3"></i>Todas las Citas</a>
            <a th:href="@{/recepcionista/citas/nueva}" class="nav-link"><i class="bi bi-plus-circle"></i>Nueva Cita</a>
            <a th:href="@{/recepcionista/pacientes}" class="nav-link"><i class="bi bi-person-lines-fill"></i>Pacientes</a>
        </li>

        <!-- PACIENTE -->
        <li sec:authorize="hasRole('PACIENTE')">
            <a th:href="@{/paciente/dashboard}" class="nav-link"><i class="bi bi-house"></i>Inicio</a>
            <a th:href="@{/paciente/citas/solicitar}" class="nav-link"><i class="bi bi-calendar-plus"></i>Solicitar Cita</a>
            <a th:href="@{/paciente/citas}" class="nav-link"><i class="bi bi-calendar3"></i>Mis Citas</a>
            <a th:href="@{/paciente/historial}" class="nav-link"><i class="bi bi-file-medical"></i>Mi Historial</a>
        </li>

        <!-- ODONTÓLOGO -->
        <li sec:authorize="hasRole('ODONTOLOGO')">
            <a th:href="@{/odontologo/dashboard}" class="nav-link"><i class="bi bi-speedometer2"></i>Dashboard</a>
            <a th:href="@{/odontologo/historiales}" class="nav-link"><i class="bi bi-file-medical"></i>Historiales</a>
            <a th:href="@{/odontologo/historiales/nuevo}" class="nav-link"><i class="bi bi-file-plus"></i>Nuevo Historial</a>
            <a th:href="@{/odontologo/horario}" class="nav-link"><i class="bi bi-clock"></i>Mi Horario</a>
        </li>
    </ul>

    <!-- Logout -->
    <div class="p-3 mt-auto">
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-outline-light w-100 btn-sm">
                <i class="bi bi-box-arrow-left"></i> Cerrar sesión
            </button>
        </form>
    </div>
</nav>

</body>
</html>
