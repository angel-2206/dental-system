<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Usuarios Pendientes — DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        :root{--dp:#0077b6}
        body{background:#f8fafc;font-family:'Segoe UI',sans-serif}
        .sidebar{min-height:100vh;background:linear-gradient(180deg,var(--dp) 0%,#023e8a 100%);width:240px;position:fixed;left:0;top:0;z-index:100;padding-top:1rem}
        .sidebar .nav-link{color:rgba(255,255,255,.8);padding:.6rem 1.2rem;border-radius:8px;margin:2px 8px}
        .sidebar .nav-link:hover{background:rgba(255,255,255,.15);color:#fff}
        .sidebar-brand{color:#fff;font-size:1.2rem;font-weight:700;padding:1rem 1.2rem 1.5rem;display:block;text-decoration:none}
        .sidebar-brand span{color:#90e0ef}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 2rem;margin-left:240px;position:sticky;top:0;z-index:99}
        .main-content{margin-left:240px;padding:2rem}
        .section-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:1.5rem}
        .table th{font-size:.8rem;text-transform:uppercase;color:#64748b;font-weight:600}
        .badge-pendiente{background:#fef3c7;color:#92400e;border-radius:6px;padding:3px 10px;font-size:.78rem}
    </style>
</head>
<body>
<nav class="sidebar d-flex flex-column">
    <a class="sidebar-brand" href="/"><i class="bi bi-tooth me-1"></i>Dental<span>Care</span></a>
    <ul class="nav flex-column flex-grow-1 px-1">
        <li><a href="/admin/dashboard" class="nav-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li><a href="/admin/usuarios/pendientes" class="nav-link active"><i class="bi bi-person-check me-2"></i>Pendientes</a></li>
        <li><a href="/admin/usuarios" class="nav-link"><i class="bi bi-people me-2"></i>Usuarios</a></li>
    </ul>
    <div class="p-3 mt-auto">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-outline-light w-100 btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión</button>
        </form>
    </div>
</nav>

<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold" style="color:#1e3a5f;">Usuarios Pendientes de Aprobación</h5>
    <a href="/admin/dashboard" class="btn btn-sm btn-outline-secondary rounded-pill">
        <i class="bi bi-arrow-left me-1"></i>Dashboard
    </a>
</div>

<div class="main-content">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show rounded-3">
        <i class="bi bi-check-circle me-1"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="section-card">
        <div th:if="${#lists.isEmpty(usuarios)}" class="text-center py-5 text-muted">
            <i class="bi bi-check-circle" style="font-size:3rem;color:#10b981;"></i>
            <p class="mt-3">No hay usuarios pendientes de aprobación.</p>
        </div>

        <div th:if="${!#lists.isEmpty(usuarios)}">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Usuario</th>
                    <th>Email</th>
                    <th>Fecha Registro</th>
                    <th>Estado</th>
                    <th>Asignar Rol</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.nombreCompleto}"></td>
                    <td><code th:text="${u.username}"></code></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${#temporals.format(u.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><span class="badge-pendiente">PENDIENTE</span></td>
                    <td>
                        <!-- Formulario de aprobación inline -->
                        <form th:action="@{'/admin/usuarios/' + ${u.id} + '/aprobar'}" method="post"
                              class="d-flex gap-2 align-items-center">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <select name="rol" class="form-select form-select-sm" style="width:150px;" required>
                                <option value="">-- Rol --</option>
                                <option value="PACIENTE">Paciente</option>
                                <option value="RECEPCIONISTA">Recepcionista</option>
                                <option value="ODONTOLOGO">Odontólogo</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-success rounded-pill">
                                <i class="bi bi-check me-1"></i>Aprobar
                            </button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{'/admin/usuarios/' + ${u.id} + '/desactivar'}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill"
                                    onclick="return confirm('¿Desactivar este usuario?')">
                                <i class="bi bi-x-circle"></i> Rechazar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
