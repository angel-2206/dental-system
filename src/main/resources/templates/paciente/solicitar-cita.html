<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Solicitar Cita — DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        :root{--dp:#0077b6}
        body{background:#f8fafc;font-family:'Segoe UI',sans-serif}
        .sidebar{min-height:100vh;background:linear-gradient(180deg,var(--dp) 0%,#023e8a 100%);width:240px;position:fixed;left:0;top:0;z-index:100;padding-top:1rem}
        .sidebar .nav-link{color:rgba(255,255,255,.8);padding:.6rem 1.2rem;border-radius:8px;margin:2px 8px}
        .sidebar .nav-link:hover,.sidebar .nav-link.active{background:rgba(255,255,255,.15);color:#fff}
        .sidebar-brand{color:#fff;font-size:1.2rem;font-weight:700;padding:1rem 1.2rem 1.5rem;display:block;text-decoration:none}
        .sidebar-brand span{color:#90e0ef}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 2rem;margin-left:240px;position:sticky;top:0;z-index:99}
        .main-content{margin-left:240px;padding:2rem}
        .form-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:2rem;max-width:620px}
        .form-control,.form-select{border-radius:10px;border:1.5px solid #e2e8f0;}
        .form-control:focus,.form-select:focus{border-color:#00b4d8;box-shadow:0 0 0 .2rem rgba(0,180,216,.2);}
        .odo-card{background:#f8fafc;border-radius:10px;border:2px solid #e2e8f0;padding:.9rem 1.1rem;cursor:pointer;transition:border-color .2s,background .2s}
        .odo-card:hover{border-color:#0077b6;background:#f0f9ff}
        .odo-card.selected{border-color:#0077b6;background:#e0f2fe}
        .info-box{background:#f0f9ff;border-left:4px solid #0077b6;border-radius:8px;padding:.8rem 1rem;font-size:.85rem;color:#1e3a5f}
    </style>
</head>
<body>
<nav class="sidebar d-flex flex-column">
    <a class="sidebar-brand" href="/"><i class="bi bi-tooth me-1"></i>Dental<span>Care</span></a>
    <ul class="nav flex-column flex-grow-1 px-1">
        <li><a href="/paciente/dashboard" class="nav-link"><i class="bi bi-house me-2"></i>Inicio</a></li>
        <li><a href="/paciente/citas/solicitar" class="nav-link active"><i class="bi bi-calendar-plus me-2"></i>Solicitar Cita</a></li>
        <li><a href="/paciente/citas" class="nav-link"><i class="bi bi-calendar3 me-2"></i>Mis Citas</a></li>
        <li><a href="/paciente/historial" class="nav-link"><i class="bi bi-file-medical me-2"></i>Mi Historial</a></li>
    </ul>
    <div class="p-3 mt-auto">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-outline-light w-100 btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión</button>
        </form>
    </div>
</nav>

<div class="topbar"><h5 class="mb-0 fw-bold" style="color:#1e3a5f;">Solicitar Nueva Cita</h5></div>

<div class="main-content">

    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show rounded-3 mb-3">
        <i class="bi bi-check-circle me-1"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-3">
        <i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="form-card">

        <!-- Sin odontólogos registrados aún -->
        <div th:if="${#lists.isEmpty(odontologos)}" class="info-box mb-3">
            <i class="bi bi-info-circle me-1"></i>
            No hay odontólogos disponibles aún. Contacta a recepción.
        </div>

        <form th:if="${!#lists.isEmpty(odontologos)}"
              th:action="@{/paciente/citas/solicitar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- ✅ Selección de odontólogo -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Selecciona un Odontólogo</label>
                <div class="d-flex flex-column gap-2" id="lista-odos">
                    <div th:each="o : ${odontologos}"
                         class="odo-card"
                         th:attr="data-id=${o.id}"
                         onclick="seleccionarOdo(this)">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <strong th:text="${o.usuario.nombreCompleto}"></strong>
                                <span class="badge ms-2"
                                      style="background:#e0f2fe;color:#0077b6;font-size:.78rem;"
                                      th:text="${o.especialidad ?: 'Odontología General'}"></span>
                            </div>
                            <i class="bi bi-check-circle-fill text-primary d-none check-icon"></i>
                        </div>
                        <small class="text-muted mt-1 d-block">
                            <i class="bi bi-clock me-1"></i>
                            <span th:text="${o.horarioDisponible ?: 'Consultar horario disponible'}"></span>
                        </small>
                    </div>
                </div>
                <!-- ✅ name="odontologo.id" para que coincida con @RequestParam("odontologo.id") -->
                <input type="hidden" id="odontologoId" name="odontologo.id" required/>
                <div id="odoError" class="text-danger small mt-1 d-none">Debes seleccionar un odontólogo.</div>
            </div>

            <!-- ✅ Fecha y Hora — name="fechaHora" -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Fecha y Hora preferida</label>
                <input type="datetime-local" class="form-control" name="fechaHora" required/>
                <div class="form-text">Selecciona la fecha y hora de tu preferencia (sujeto a confirmación).</div>
            </div>

            <!-- ✅ Motivo — name="motivo" -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Motivo de la consulta</label>
                <textarea class="form-control" name="motivo" rows="3"
                          placeholder="Ej: Dolor de muela, limpieza dental, revisión general..."
                          required></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn px-4 fw-semibold"
                        style="background:#0077b6;color:#fff;border-radius:10px;"
                        onclick="return validarForm()">
                    <i class="bi bi-send me-1"></i>Enviar Solicitud
                </button>
                <a href="/paciente/dashboard" class="btn btn-outline-secondary" style="border-radius:10px;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script>
function seleccionarOdo(el) {
    // Quitar selección previa
    document.querySelectorAll('.odo-card').forEach(c => {
        c.classList.remove('selected');
        c.querySelector('.check-icon').classList.add('d-none');
    });
    // Marcar el seleccionado
    el.classList.add('selected');
    el.querySelector('.check-icon').classList.remove('d-none');
    // Guardar ID en el input hidden
    document.getElementById('odontologoId').value = el.getAttribute('data-id');
    document.getElementById('odoError').classList.add('d-none');
}

function validarForm() {
    const id = document.getElementById('odontologoId').value;
    if (!id) {
        document.getElementById('odoError').classList.remove('d-none');
        return false;
    }
    return true;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
