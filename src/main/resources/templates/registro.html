<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Registro — DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        body { background: linear-gradient(135deg,#023e8a 0%,#0077b6 60%,#00b4d8 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 0; }
        .reg-card { background:#fff; border-radius:20px; padding:2.5rem 2rem; width:100%; max-width:580px; box-shadow:0 20px 60px rgba(0,0,0,.2); }
        .brand { text-align:center; margin-bottom:1.5rem; }
        .brand .icon { font-size:2.2rem; color:#0077b6; }
        .brand h2 { font-weight:800; color:#0077b6; margin:.3rem 0 0; }
        .brand p { color:#64748b; font-size:.9rem; }
        .form-control, .form-select { border-radius:10px; padding:.6rem 1rem; border:1.5px solid #e2e8f0; }
        .form-control:focus, .form-select:focus { border-color:#00b4d8; box-shadow:0 0 0 .2rem rgba(0,180,216,.2); }
        .input-group-text { background:#f0f9ff; border:1.5px solid #e2e8f0; border-radius:10px 0 0 10px; color:#0077b6; }
        .btn-registrar { background:linear-gradient(90deg,#0077b6,#00b4d8); color:#fff; border:none; border-radius:10px; width:100%; padding:.7rem; font-size:1rem; font-weight:600; }
        .btn-registrar:hover { opacity:.9; color:#fff; }
        .back-link { position:fixed; top:1.2rem; left:1.5rem; color:rgba(255,255,255,.8); text-decoration:none; font-size:.9rem; }
        .back-link:hover { color:#fff; }
        .info-box { background:#f0f9ff; border-left:4px solid #0077b6; border-radius:8px; padding:.8rem 1rem; font-size:.85rem; color:#1e3a5f; }
        .section-title { font-size:.78rem; text-transform:uppercase; font-weight:700; color:#0077b6; letter-spacing:.05em; margin:1.2rem 0 .6rem; padding-bottom:.3rem; border-bottom:2px solid #e0f2fe; }
    </style>
</head>
<body>
<a href="/" class="back-link"><i class="bi bi-arrow-left me-1"></i>Volver al inicio</a>
<div class="reg-card">
    <div class="brand">
        <div class="icon"><i class="bi bi-tooth"></i></div>
        <h2>DentalCare</h2>
        <p>Crea tu cuenta — el administrador aprobará y asignará tu rol</p>
    </div>

    <div th:if="${error}" class="alert alert-danger py-2 px-3 rounded-3 mb-3">
        <i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span>
    </div>
    <div th:if="${exito}" class="alert alert-success py-2 px-3 rounded-3 mb-3">
        <i class="bi bi-check-circle me-1"></i><span th:text="${exito}"></span>
    </div>

    <form th:action="@{/registro}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- ── Datos de acceso ── -->
        <div class="section-title"><i class="bi bi-person-badge me-1"></i>Datos de acceso</div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Nombre completo</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" name="nombreCompleto"
                       placeholder="Tu nombre completo" required/>
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-at"></i></span>
                    <input type="text" class="form-control" name="username"
                           placeholder="usuario123" required/>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" name="email"
                           placeholder="correo@ejemplo.com" required/>
                </div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" name="password"
                       placeholder="Mínimo 6 caracteres" required/>
            </div>
        </div>

        <!-- ── Datos del paciente ── -->
        <div class="section-title"><i class="bi bi-file-medical me-1"></i>Datos del paciente</div>

        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">DNI</label>
                <input type="text" class="form-control" name="dni"
                       placeholder="12345678" maxlength="20"/>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Teléfono</label>
                <input type="text" class="form-control" name="telefono"
                       placeholder="999 999 999"/>
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Fecha de nacimiento</label>
                <input type="date" class="form-control" name="fechaNacimiento"/>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Tipo de sangre</label>
                <select class="form-select" name="tipoSangre">
                    <option value="">-- Seleccionar --</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Dirección</label>
            <input type="text" class="form-control" name="direccion"
                   placeholder="Av. Principal 123, Lima"/>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Alergias conocidas</label>
            <input type="text" class="form-control" name="alergias"
                   placeholder="Ej: Penicilina, látex... (opcional)"/>
        </div>

        <div class="info-box mb-4">
            <i class="bi bi-info-circle me-1"></i>
            Tu cuenta quedará <strong>pendiente de aprobación</strong>. El administrador revisará
            tu solicitud y asignará tu rol.	
        </div>

        <button type="submit" class="btn-registrar">
            <i class="bi bi-person-plus me-2"></i>Crear cuenta
        </button>
    </form>

    <p class="text-center text-muted mt-3" style="font-size:.9rem;">
        ¿Ya tienes cuenta?
        <a href="/login" style="color:#0077b6; font-weight:600;">Inicia sesión</a>
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
