# =============================================
# CONFIGURACIÓN MySQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/dental_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
# create-drop: borra y crea tablas cada vez que arranca (útil en desarrollo)
# update: solo actualiza sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ✅ Evita que Hibernate falle si las tablas aún no existen al arrancar
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# =============================================
# THYMELEAF
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# =============================================
# SUBIDA DE ARCHIVOS
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/imagenes

# =============================================
# SERVIDOR
# =============================================
server.port=9090
