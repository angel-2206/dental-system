<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Odontólogo — DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        :root{--dp:#0077b6}
        body{background:#f8fafc;font-family:'Segoe UI',sans-serif}
        .sidebar{min-height:100vh;background:linear-gradient(180deg,var(--dp) 0%,#023e8a 100%);width:240px;position:fixed;left:0;top:0;z-index:100;padding-top:1rem}
        .sidebar .nav-link{color:rgba(255,255,255,.8);padding:.6rem 1.2rem;border-radius:8px;margin:2px 8px}
        .sidebar .nav-link:hover,.sidebar .nav-link.active{background:rgba(255,255,255,.15);color:#fff}
        .sidebar-brand{color:#fff;font-size:1.2rem;font-weight:700;padding:1rem 1.2rem 1.5rem;display:block;text-decoration:none}
        .sidebar-brand span{color:#90e0ef}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 2rem;margin-left:240px;position:sticky;top:0;z-index:99}
        .main-content{margin-left:240px;padding:2rem}
        .stat-card{border-radius:14px;padding:1.4rem;color:#fff}
        .section-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:1.5rem}
    </style>
</head>
<body>
<nav class="sidebar d-flex flex-column">
    <a class="sidebar-brand" href="/"><i class="bi bi-tooth me-1"></i>Dental<span>Care</span></a>
    <ul class="nav flex-column flex-grow-1 px-1">
        <li><a href="/odontologo/dashboard" class="nav-link active"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li><a href="/odontologo/historiales" class="nav-link"><i class="bi bi-file-medical me-2"></i>Historiales</a></li>
        <li><a href="/odontologo/historiales/nuevo" class="nav-link"><i class="bi bi-file-plus me-2"></i>Nuevo Historial</a></li>
        <li><a href="/odontologo/horario" class="nav-link"><i class="bi bi-clock me-2"></i>Mi Horario</a></li>
    </ul>
    <div class="p-3 mt-auto">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-outline-light w-100 btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión</button>
        </form>
    </div>
</nav>
<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold" style="color:#1e3a5f;">Panel Odontólogo</h5>
    <span class="text-muted" style="font-size:.9rem;"><i class="bi bi-person-circle me-1"></i><sec:authentication property="name"/></span>
</div>
<div class="main-content">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show rounded-3">
        <i class="bi bi-check-circle me-1"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="row g-3 mb-4">
        <div class="col-sm-6">
            <div class="stat-card" style="background:linear-gradient(135deg,#0077b6,#00b4d8);">
                <div style="font-size:2rem;font-weight:800;" th:text="${#lists.size(misCitas)}">0</div>
                <div style="font-size:.85rem;opacity:.85;">Mis Citas</div>
            </div>
        </div>
        <div class="col-sm-6">
            <div class="stat-card" style="background:linear-gradient(135deg,#8b5cf6,#a78bfa);">
                <div style="font-size:2rem;font-weight:800;" th:text="${totalHistoriales}">0</div>
                <div style="font-size:.85rem;opacity:.85;">Historiales Clínicos</div>
            </div>
        </div>
    </div>
    <div class="section-card mb-3">
        <h6 class="fw-bold mb-2" style="color:#1e3a5f;"><i class="bi bi-clock me-2"></i>Mi Horario de Disponibilidad</h6>
        <p class="text-muted mb-2" th:text="${odontologo.horarioDisponible ?: 'Sin horario registrado. Ve a Mi Horario para actualizarlo.'}"></p>
        <a href="/odontologo/horario" class="btn btn-sm" style="background:#0077b6;color:#fff;border-radius:8px;">Actualizar horario</a>
    </div>
    <div class="section-card">
        <h6 class="fw-bold mb-3" style="color:#1e3a5f;"><i class="bi bi-calendar3 me-2"></i>Mis próximas citas</h6>
        <div th:if="${#lists.isEmpty(misCitas)}" class="text-center py-3 text-muted">No tienes citas programadas.</div>
        <table th:if="${!#lists.isEmpty(misCitas)}" class="table table-hover align-middle">
            <thead><tr>
                <th>Paciente</th><th>Fecha/Hora</th><th>Motivo</th><th>Estado</th>
            </tr></thead>
            <tbody>
            <tr th:each="c : ${misCitas}">
                <td th:text="${c.paciente.usuario.nombreCompleto}"></td>
                <td th:text="${#temporals.format(c.fechaHora,'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${c.motivo}"></td>
                <td><span th:text="${c.estado}" style="font-size:.8rem;"></span></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
