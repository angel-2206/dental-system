<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Todos los Usuarios — DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        :root{--dp:#0077b6}
        body{background:#f8fafc;font-family:'Segoe UI',sans-serif}
        .sidebar{min-height:100vh;background:linear-gradient(180deg,var(--dp) 0%,#023e8a 100%);width:240px;position:fixed;left:0;top:0;z-index:100;padding-top:1rem}
        .sidebar .nav-link{color:rgba(255,255,255,.8);padding:.6rem 1.2rem;border-radius:8px;margin:2px 8px}
        .sidebar .nav-link:hover,.sidebar .nav-link.active{background:rgba(255,255,255,.15);color:#fff}
        .sidebar-brand{color:#fff;font-size:1.2rem;font-weight:700;padding:1rem 1.2rem 1.5rem;display:block;text-decoration:none}
        .sidebar-brand span{color:#90e0ef}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 2rem;margin-left:240px;position:sticky;top:0;z-index:99}
        .main-content{margin-left:240px;padding:2rem}
        .section-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:1.5rem}
        .table th{font-size:.8rem;text-transform:uppercase;color:#64748b;font-weight:600}
        .badge-ACTIVO{background:#ecfdf5;color:#065f46;border-radius:6px;padding:3px 10px;font-size:.78rem;font-weight:600}
        .badge-PENDIENTE{background:#fef3c7;color:#92400e;border-radius:6px;padding:3px 10px;font-size:.78rem;font-weight:600}
        .badge-INACTIVO{background:#f1f5f9;color:#475569;border-radius:6px;padding:3px 10px;font-size:.78rem;font-weight:600}
        .badge-rol{background:#eff6ff;color:#1d4ed8;border-radius:6px;padding:3px 10px;font-size:.78rem;font-weight:600}
    </style>
</head>
<body>
<nav class="sidebar d-flex flex-column">
    <a class="sidebar-brand" href="/"><i class="bi bi-tooth me-1"></i>Dental<span>Care</span></a>
    <ul class="nav flex-column flex-grow-1 px-1">
        <li><a href="/admin/dashboard" class="nav-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li><a href="/admin/usuarios/pendientes" class="nav-link"><i class="bi bi-person-check me-2"></i>Pendientes</a></li>
        <li><a href="/admin/usuarios" class="nav-link active"><i class="bi bi-people me-2"></i>Usuarios</a></li>
    </ul>
    <div class="p-3 mt-auto">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-outline-light w-100 btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión</button>
        </form>
    </div>
</nav>
<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold" style="color:#1e3a5f;">Todos los Usuarios</h5>
    <a href="/admin/usuarios/pendientes" class="btn btn-sm btn-outline-warning rounded-pill">
        <i class="bi bi-person-clock me-1"></i>Ver Pendientes
    </a>
</div>
<div class="main-content">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show rounded-3">
        <i class="bi bi-check-circle me-1"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="section-card">
        <table class="table table-hover align-middle">
            <thead><tr>
                <th>#</th><th>Nombre</th><th>Usuario</th><th>Email</th>
                <th>Rol</th><th>Estado</th><th>Registro</th><th>Acción</th>
            </tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="8" class="text-center text-muted py-4">No hay usuarios.</td>
            </tr>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.nombreCompleto}"></td>
                <td><code th:text="${u.username}"></code></td>
                <td th:text="${u.email}"></td>
                <td><span class="badge-rol" th:text="${u.rol}"></span></td>
                <td><span th:class="'badge-' + ${u.estado}" th:text="${u.estado}"></span></td>
                <td th:text="${#temporals.format(u.fechaRegistro,'dd/MM/yyyy')}"></td>
                <td>
                    <form th:if="${u.estado.name() != 'INACTIVO' and u.rol.name() != 'ADMIN'}"
                          th:action="@{'/admin/usuarios/' + ${u.id} + '/desactivar'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-sm btn-outline-danger rounded-pill"
                                onclick="return confirm('¿Desactivar a este usuario?')">
                            <i class="bi bi-person-slash"></i>
                        </button>
                    </form>
                    <span th:if="${u.rol.name() == 'ADMIN'}" class="text-muted small">Admin</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
