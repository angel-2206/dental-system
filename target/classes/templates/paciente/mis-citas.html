<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mis Citas — DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        :root{--dp:#0077b6}
        body{background:#f8fafc;font-family:'Segoe UI',sans-serif}
        .sidebar{min-height:100vh;background:linear-gradient(180deg,var(--dp) 0%,#023e8a 100%);width:240px;position:fixed;left:0;top:0;z-index:100;padding-top:1rem}
        .sidebar .nav-link{color:rgba(255,255,255,.8);padding:.6rem 1.2rem;border-radius:8px;margin:2px 8px}
        .sidebar .nav-link:hover,.sidebar .nav-link.active{background:rgba(255,255,255,.15);color:#fff}
        .sidebar-brand{color:#fff;font-size:1.2rem;font-weight:700;padding:1rem 1.2rem 1.5rem;display:block;text-decoration:none}
        .sidebar-brand span{color:#90e0ef}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 2rem;margin-left:240px;position:sticky;top:0;z-index:99}
        .main-content{margin-left:240px;padding:2rem}
        .section-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:1.5rem}
        .table th{font-size:.8rem;text-transform:uppercase;color:#64748b;font-weight:600}
        .badge-SOLICITADA{background:#fff7ed;color:#c2410c;border-radius:6px;padding:2px 8px;font-size:.75rem}
        .badge-ACEPTADA{background:#ecfdf5;color:#065f46;border-radius:6px;padding:2px 8px;font-size:.75rem}
        .badge-RECHAZADA{background:#fef2f2;color:#991b1b;border-radius:6px;padding:2px 8px;font-size:.75rem}
        .badge-CANCELADA{background:#f1f5f9;color:#475569;border-radius:6px;padding:2px 8px;font-size:.75rem}
        .badge-REPROGRAMADA{background:#eff6ff;color:#1d4ed8;border-radius:6px;padding:2px 8px;font-size:.75rem}
        .badge-COMPLETADA{background:#f5f3ff;color:#5b21b6;border-radius:6px;padding:2px 8px;font-size:.75rem}
    </style>
</head>
<body>
<nav class="sidebar d-flex flex-column">
    <a class="sidebar-brand" href="/"><i class="bi bi-tooth me-1"></i>Dental<span>Care</span></a>
    <ul class="nav flex-column flex-grow-1 px-1">
        <li><a href="/paciente/dashboard" class="nav-link"><i class="bi bi-house me-2"></i>Inicio</a></li>
        <li><a href="/paciente/citas/solicitar" class="nav-link"><i class="bi bi-calendar-plus me-2"></i>Solicitar Cita</a></li>
        <li><a href="/paciente/citas" class="nav-link active"><i class="bi bi-calendar3 me-2"></i>Mis Citas</a></li>
        <li><a href="/paciente/historial" class="nav-link"><i class="bi bi-file-medical me-2"></i>Mi Historial</a></li>
    </ul>
    <div class="p-3 mt-auto">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-outline-light w-100 btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión</button>
        </form>
    </div>
</nav>
<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold" style="color:#1e3a5f;">Mis Citas</h5>
    <a href="/paciente/citas/solicitar" class="btn btn-sm" style="background:#0077b6;color:#fff;border-radius:8px;">
        <i class="bi bi-plus me-1"></i>Nueva solicitud
    </a>
</div>
<div class="main-content">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show rounded-3 mb-3">
        <i class="bi bi-check-circle me-1"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3 mb-3">
        <i class="bi bi-exclamation-circle me-1"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="section-card">
        <div th:if="${#lists.isEmpty(citas)}" class="text-center py-5 text-muted">
            <i class="bi bi-calendar-x" style="font-size:3rem;"></i>
            <p class="mt-2">No tienes citas. <a href="/paciente/citas/solicitar">¡Solicita una!</a></p>
        </div>
        <table th:if="${!#lists.isEmpty(citas)}" class="table table-hover align-middle">
            <thead><tr>
                <th>#</th><th>Odontólogo</th><th>Fecha/Hora</th>
                <th>Motivo</th><th>Estado</th><th>Acciones</th>
            </tr></thead>
            <tbody>
            <tr th:each="c : ${citas}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.odontologo.usuario.nombreCompleto}"></td>
                <td th:text="${#temporals.format(c.fechaHora,'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${c.motivo}"></td>
                <td><span th:class="'badge-' + ${c.estado}" th:text="${c.estado}"></span></td>
                <td>
                    <!-- Cancelar solo si no está ya cancelada o rechazada -->
                    <form th:if="${c.estado.name() != 'CANCELADA' and c.estado.name() != 'RECHAZADA' and c.estado.name() != 'COMPLETADA'}"
                          th:action="@{'/paciente/citas/' + ${c.id} + '/cancelar'}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn btn-sm btn-outline-danger rounded-pill"
                                onclick="return confirm('¿Cancelar esta cita?')">
                            <i class="bi bi-x-circle me-1"></i>Cancelar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
