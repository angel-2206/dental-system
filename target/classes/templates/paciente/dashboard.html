<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mi Panel — DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        :root{--dp:#0077b6;--ds:#00b4d8}
        body{background:#f8fafc;font-family:'Segoe UI',sans-serif}
        .sidebar{min-height:100vh;background:linear-gradient(180deg,var(--dp) 0%,#023e8a 100%);width:240px;position:fixed;left:0;top:0;z-index:100;padding-top:1rem}
        .sidebar .nav-link{color:rgba(255,255,255,.8);padding:.6rem 1.2rem;border-radius:8px;margin:2px 8px}
        .sidebar .nav-link:hover{background:rgba(255,255,255,.15);color:#fff}
        .sidebar-brand{color:#fff;font-size:1.2rem;font-weight:700;padding:1rem 1.2rem 1.5rem;display:block;text-decoration:none}
        .sidebar-brand span{color:#90e0ef}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 2rem;margin-left:240px;position:sticky;top:0;z-index:99}
        .main-content{margin-left:240px;padding:2rem}
        .cita-card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:1rem 1.2rem;margin-bottom:.8rem}
        .badge-SOLICITADA{background:#fff7ed;color:#c2410c;border-radius:6px;padding:3px 10px;font-size:.78rem}
        .badge-ACEPTADA{background:#ecfdf5;color:#065f46;border-radius:6px;padding:3px 10px;font-size:.78rem}
        .badge-RECHAZADA{background:#fef2f2;color:#991b1b;border-radius:6px;padding:3px 10px;font-size:.78rem}
        .badge-CANCELADA{background:#f1f5f9;color:#475569;border-radius:6px;padding:3px 10px;font-size:.78rem}
        .badge-REPROGRAMADA{background:#eff6ff;color:#1d4ed8;border-radius:6px;padding:3px 10px;font-size:.78rem}
        .badge-COMPLETADA{background:#f5f3ff;color:#5b21b6;border-radius:6px;padding:3px 10px;font-size:.78rem}
    </style>
</head>
<body>
<nav class="sidebar d-flex flex-column">
    <a class="sidebar-brand" href="/"><i class="bi bi-tooth me-1"></i>Dental<span>Care</span></a>
    <ul class="nav flex-column flex-grow-1 px-1">
        <li><a href="/paciente/dashboard" class="nav-link active"><i class="bi bi-house me-2"></i>Inicio</a></li>
        <li><a href="/paciente/citas/solicitar" class="nav-link"><i class="bi bi-calendar-plus me-2"></i>Solicitar Cita</a></li>
        <li><a href="/paciente/citas" class="nav-link"><i class="bi bi-calendar3 me-2"></i>Mis Citas</a></li>
        <li><a href="/paciente/historial" class="nav-link"><i class="bi bi-file-medical me-2"></i>Mi Historial</a></li>
    </ul>
    <div class="p-3 mt-auto">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-outline-light w-100 btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión</button>
        </form>
    </div>
</nav>

<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold" style="color:#1e3a5f;">Bienvenido, <span th:text="${paciente.usuario.nombreCompleto}">Paciente</span></h5>
    <span class="badge rounded-pill" style="background:#f0f9ff;color:#0077b6;" th:text="${paciente.esNuevo ? 'Paciente Nuevo' : 'Paciente Antiguo'}"></span>
</div>

<div class="main-content">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show rounded-3">
        <i class="bi bi-check-circle me-1"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div style="background:linear-gradient(135deg,#0077b6,#00b4d8);border-radius:14px;padding:1.4rem;color:#fff;">
                <div style="font-size:1.8rem;font-weight:800;" th:text="${#lists.size(misCitas)}">0</div>
                <div style="font-size:.85rem;opacity:.85;">Total de Citas</div>
            </div>
        </div>
        <div class="col-md-4">
            <a href="/paciente/citas/solicitar" style="text-decoration:none;">
                <div style="background:linear-gradient(135deg,#10b981,#34d399);border-radius:14px;padding:1.4rem;color:#fff;">
                    <i class="bi bi-plus-circle" style="font-size:1.8rem;"></i>
                    <div style="font-size:.85rem;opacity:.85;margin-top:.3rem;">Solicitar nueva cita</div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="/paciente/historial" style="text-decoration:none;">
                <div style="background:linear-gradient(135deg,#8b5cf6,#a78bfa);border-radius:14px;padding:1.4rem;color:#fff;">
                    <i class="bi bi-file-medical" style="font-size:1.8rem;"></i>
                    <div style="font-size:.85rem;opacity:.85;margin-top:.3rem;">Ver mi historial clínico</div>
                </div>
            </a>
        </div>
    </div>

    <h6 class="fw-bold mb-3" style="color:#1e3a5f;">Mis últimas citas</h6>
    <div th:if="${#lists.isEmpty(misCitas)}" class="text-center py-4 text-muted">
        <i class="bi bi-calendar-x" style="font-size:2.5rem;"></i>
        <p class="mt-2">No tienes citas registradas. <a href="/paciente/citas/solicitar">¡Solicita una!</a></p>
    </div>
    <div th:each="cita : ${misCitas}" class="cita-card d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <div class="fw-600" style="font-weight:600;" th:text="${cita.odontologo.usuario.nombreCompleto}">Dr. Nombre</div>
            <div class="text-muted small" th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</div>
            <div class="text-muted small" th:text="${cita.motivo}">Motivo</div>
        </div>
        <span th:class="'badge-' + ${cita.estado}" th:text="${cita.estado}">ESTADO</span>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
