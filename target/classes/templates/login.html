<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar Sesión — DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        body {
            background: linear-gradient(135deg, #023e8a 0%, #0077b6 60%, #00b4d8 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #fff; border-radius: 20px;
            padding: 2.5rem 2rem; width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
        }
        .brand { text-align: center; margin-bottom: 1.8rem; }
        .brand .icon { font-size: 2.5rem; color: #0077b6; }
        .brand h2 { font-weight: 800; color: #0077b6; margin: .3rem 0 0; }
        .brand p { color: #64748b; font-size: .9rem; }
        .form-control { border-radius: 10px; padding: .65rem 1rem; border: 1.5px solid #e2e8f0; }
        .form-control:focus { border-color: #00b4d8; box-shadow: 0 0 0 .2rem rgba(0,180,216,.2); }
        .input-group-text { border-radius: 10px 0 0 10px; background: #f0f9ff; border: 1.5px solid #e2e8f0; color: #0077b6; }
        .btn-ingresar {
            background: linear-gradient(90deg, #0077b6, #00b4d8);
            color: #fff; border: none; border-radius: 10px;
            width: 100%; padding: .7rem; font-size: 1rem; font-weight: 600;
            transition: opacity .2s;
        }
        .btn-ingresar:hover { opacity: .9; color: #fff; }
        .divider { text-align: center; color: #94a3b8; font-size: .85rem; margin: 1rem 0; }
        .link-register { color: #0077b6; font-weight: 600; text-decoration: none; }
        .link-register:hover { text-decoration: underline; }
        .back-link { position: fixed; top: 1.2rem; left: 1.5rem; color: rgba(255,255,255,.8); text-decoration: none; font-size: .9rem; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

<a href="/" class="back-link"><i class="bi bi-arrow-left me-1"></i>Volver al inicio</a>

<div class="login-card">
    <div class="brand">
        <div class="icon"><i class="bi bi-tooth"></i></div>
        <h2>DentalCare</h2>
        <p>Ingresa tus credenciales para continuar</p>
    </div>

    <!-- Alertas -->
    <div th:if="${error}" class="alert alert-danger alert-sm py-2 px-3 rounded-3 mb-3" role="alert">
        <i class="bi bi-exclamation-circle me-1"></i>
        <span th:text="${error}"></span>
    </div>
    <div th:if="${logout}" class="alert alert-success alert-sm py-2 px-3 rounded-3 mb-3" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${logout}"></span>
    </div>

    <!-- Formulario de login (Spring Security procesa /login) -->
    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label class="form-label fw-600" style="font-weight:600;">Usuario</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control"
                       placeholder="Tu nombre de usuario" required autofocus/>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-600" style="font-weight:600;">Contraseña</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control"
                       placeholder="••••••••" required/>
            </div>
        </div>

        <button type="submit" class="btn-ingresar">
            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
        </button>
    </form>

    <div class="divider">— o —</div>

    <p class="text-center text-muted" style="font-size:.9rem;">
        ¿No tienes cuenta?
        <a href="/registro" class="link-register">Regístrate aquí</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
