<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Solicitudes de Cita — DentalCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <style>
        :root{--dp:#0077b6}
        body{background:#f8fafc;font-family:'Segoe UI',sans-serif}
        .sidebar{min-height:100vh;background:linear-gradient(180deg,var(--dp) 0%,#023e8a 100%);width:240px;position:fixed;left:0;top:0;z-index:100;padding-top:1rem}
        .sidebar .nav-link{color:rgba(255,255,255,.8);padding:.6rem 1.2rem;border-radius:8px;margin:2px 8px}
        .sidebar .nav-link:hover,.sidebar .nav-link.active{background:rgba(255,255,255,.15);color:#fff}
        .sidebar-brand{color:#fff;font-size:1.2rem;font-weight:700;padding:1rem 1.2rem 1.5rem;display:block;text-decoration:none}
        .sidebar-brand span{color:#90e0ef}
        .topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:.75rem 2rem;margin-left:240px;position:sticky;top:0;z-index:99}
        .main-content{margin-left:240px;padding:2rem}
        .section-card{background:#fff;border-radius:14px;border:1px solid #e2e8f0;padding:1.5rem}
        .table th{font-size:.8rem;text-transform:uppercase;color:#64748b;font-weight:600}
    </style>
</head>
<body>
<nav class="sidebar d-flex flex-column">
    <a class="sidebar-brand" href="/"><i class="bi bi-tooth me-1"></i>Dental<span>Care</span></a>
    <ul class="nav flex-column flex-grow-1 px-1">
        <li><a href="/recepcionista/dashboard" class="nav-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li><a href="/recepcionista/citas/solicitadas" class="nav-link active"><i class="bi bi-calendar-check me-2"></i>Solicitudes</a></li>
        <li><a href="/recepcionista/citas" class="nav-link"><i class="bi bi-calendar3 me-2"></i>Todas las Citas</a></li>
        <li><a href="/recepcionista/citas/nueva" class="nav-link"><i class="bi bi-plus-circle me-2"></i>Nueva Cita</a></li>
        <li><a href="/recepcionista/pacientes" class="nav-link"><i class="bi bi-person-lines-fill me-2"></i>Pacientes</a></li>
    </ul>
    <div class="p-3 mt-auto">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-outline-light w-100 btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Cerrar sesión</button>
        </form>
    </div>
</nav>
<div class="topbar d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-bold" style="color:#1e3a5f;">Solicitudes de Cita Pendientes</h5>
    <a href="/recepcionista/dashboard" class="btn btn-sm btn-outline-secondary rounded-pill"><i class="bi bi-arrow-left me-1"></i>Dashboard</a>
</div>
<div class="main-content">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show rounded-3">
        <i class="bi bi-check-circle me-1"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="section-card">
        <div th:if="${#lists.isEmpty(citas)}" class="text-center py-5 text-muted">
            <i class="bi bi-calendar-check" style="font-size:3rem;color:#10b981;"></i>
            <p class="mt-2">No hay solicitudes de cita pendientes.</p>
        </div>
        <div th:if="${!#lists.isEmpty(citas)}">
            <table class="table table-hover align-middle">
                <thead><tr>
                    <th>#</th><th>Paciente</th><th>Odontólogo</th>
                    <th>Fecha/Hora</th><th>Motivo</th><th>Solicitud</th><th>Acciones</th>
                </tr></thead>
                <tbody>
                <tr th:each="c : ${citas}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.paciente.usuario.nombreCompleto}"></td>
                    <td th:text="${c.odontologo.usuario.nombreCompleto}"></td>
                    <td th:text="${#temporals.format(c.fechaHora,'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${c.motivo}"></td>
                    <td th:text="${#temporals.format(c.fechaSolicitud,'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <div class="d-flex gap-2 flex-wrap">
                            <form th:action="@{'/recepcionista/citas/' + ${c.id} + '/aceptar'}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="observaciones" value="Cita confirmada"/>
                                <button class="btn btn-sm btn-success rounded-pill"><i class="bi bi-check me-1"></i>Aceptar</button>
                            </form>
                            <form th:action="@{'/recepcionista/citas/' + ${c.id} + '/rechazar'}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="observaciones" value="Horario no disponible"/>
                                <button class="btn btn-sm btn-outline-danger rounded-pill"><i class="bi bi-x me-1"></i>Rechazar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
